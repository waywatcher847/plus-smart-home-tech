server:
  port: 8888
logging:
  level:
    org.springframework.cloud.config.server: DEBUG
spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations:
            - file:${user.dir}/infra/config-repo
            - file:${user.dir}/infra/config-repo/telemetry